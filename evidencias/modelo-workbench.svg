.t{font: bold 22px Arial;fill:#fff}.menu{font:15px Arial;fill:#333}.sql{font: bold 20px monospace;fill:#0757b8}.txt{font:15px Arial;fill:#222}.small{font:13px Arial;fill:#333}.head{fill:#f5f6f8;stroke:#aeb8c4}.pane{fill:#fff;stroke:#aeb8c4}.blue{fill:#17334b}
</style></defs>
<g transform="translate(0,0)"><rect class="pane" x="8" y="8" width="744" height="490" rx="8"/><rect class="head" x="8" y="8" width="744" height="34"/><text class="menu" x="24" y="31">MySQL Workbench   File   Edit   View   Query   Database   Server   Tools</text><rect class="blue" x="190" y="58" width="480" height="38" rx="8"/><text class="t" x="208" y="84">1. Índices existentes</text><text class="sql" x="205" y="145">USE escola_curso;</text><text class="sql" x="205" y="178">SHOW INDEX FROM aluno;</text><rect class="pane" x="180" y="215" width="550" height="235"/><text class="txt" x="195" y="245">Result Grid</text><path d="M190 258H720 M190 290H720 M190 322H720 M190 354H720" stroke="#b9c3ce"/><text class="small" x="200" y="280">Table      Non_unique     Key_name       Column_name</text><text class="small" x="200" y="312">aluno      0              PRIMARY        id_aluno</text><text class="small" x="200" y="344">aluno      1              idx_aluno_nome nome</text><text class="small" x="200" y="376">aluno      1              idx_aluno_cidade cidade</text><text class="small" x="20" y="120">SCHEMAS</text><text class="small" x="20" y="148">▾ escola_curso</text><text class="small" x="36" y="174">Tables</text><text class="small" x="36" y="198">Views</text></g>
<g transform="translate(776,0)"><rect class="pane" x="8" y="8" width="744" height="490" rx="8"/><rect class="head" x="8" y="8" width="744" height="34"/><text class="menu" x="24" y="31">MySQL Workbench   File   Edit   View   Query   Database   Server   Tools</text><rect class="blue" x="190" y="58" width="480" height="38" rx="8"/><text class="t" x="208" y="84">2. Análise com EXPLAIN</text><text class="sql" x="205" y="145">EXPLAIN SELECT * FROM aluno</text><text class="sql" x="205" y="178">WHERE nome = 'Ana Silva';</text><rect class="pane" x="180" y="215" width="550" height="235"/><text class="txt" x="195" y="245">Result Grid</text><path d="M190 258H720 M190 290H720 M190 322H720 M190 354H720" stroke="#b9c3ce"/><text class="small" x="200" y="280">type      possible_keys      key             rows     Extra</text><text class="small" x="200" y="312">ref       idx_aluno_nome     idx_aluno_nome  1        Using index</text><text class="small" x="20" y="120">SCHEMAS</text><text class="small" x="20" y="148">▾ escola_curso</text><text class="small" x="36" y="174">Tables</text></g>
<g transform="translate(0,510)"><rect class="pane" x="8" y="8" width="744" height="490" rx="8"/><rect class="head" x="8" y="8" width="744" height="34"/><text class="menu" x="24" y="31">MySQL Workbench   File   Edit   View   Query   Database   Server   Tools</text><rect class="blue" x="190" y="58" width="480" height="38" rx="8"/><text class="t" x="208" y="84">3. Criação de índices</text><text class="sql" x="205" y="145">CREATE INDEX idx_aluno_nome</text><text class="sql" x="205" y="178">ON aluno(nome);</text><rect class="pane" x="180" y="215" width="550" height="235"/><text class="txt" x="195" y="245">Action Output</text><path d="M190 258H720 M190 300H720 M190 342H720" stroke="#b9c3ce"/><text class="small" x="200" y="282">#     Action                      Message</text><text class="small" x="200" y="324">1     CREATE INDEX               Query OK, 0 rows affected</text><text class="small" x="200" y="366">      Duration / Fetch            0.048 sec</text></g>
<g transform="translate(776,510)"><rect class="pane" x="8" y="8" width="744" height="490" rx="8"/><rect class="head" x="8" y="8" width="744" height="34"/><text class="menu" x="24" y="31">MySQL Workbench   File   Edit   View   Query   Database   Server   Tools</text><rect class="blue" x="190" y="58" width="480" height="38" rx="8"/><text class="t" x="208" y="84">4. Comparação e seletividade</text><text class="sql" x="205" y="145">EXPLAIN SELECT * FROM aluno</text><text class="sql" x="205" y="178">WHERE situacao = 'Ativo';</text><rect class="pane" x="180" y="215" width="550" height="235"/><text class="txt" x="195" y="245">Result Grid</text><path d="M190 258H720 M190 290H720 M190 322H720 M190 354H720" stroke="#b9c3ce"/><text class="small" x="200" y="280">type      possible_keys     key      rows      Extra</text><text class="small" x="200" y="312">ALL       NULL              NULL     98        Using where</text><text class="small" x="200" y="354">Plano ilustrativo: os resultados reais variam</text></g>
<rect x="350" y="970" width="836" height="42" rx="9" fill="#17334b"/><text class="t" x="380" y="999">Imagem ilustrativa • Índices no MySQL – Escola de Cursos</text>
